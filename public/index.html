<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Restaurante · Patrones de diseño</title>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
        <header class="top">
        <h1>Restaurante</h1>
        <p>Desafío de patrones: <b>Builder</b> · <b>Decorator</b> · <b>Observer</b></p>
        </header>

        <main class="layout">
        <section class="card" aria-labelledby="new-title">
            <h2 id="new-title">Nuevo pedido</h2>

            <form id="order-form" novalidate>
            <div class="row">
                <label>Cliente
                <input id="customer" name="customer" autocomplete="off" required />
                </label>
                <label>Mesa
                <input id="table" name="table" type="number" min="1" required />
                </label>
            </div>

            <fieldset>
                <legend>Agregar plato</legend>
                <label>Plato
                <select id="dish"></select>
                </label>
                <div id="extras" class="extras" aria-label="Extras"></div>
                <button type="button" id="add-item" class="secondary">+ Agregar al pedido</button>
            </fieldset>

            <ul id="cart" class="cart" aria-live="polite"></ul>
            <p class="total">Total: <b id="cart-total">$0</b></p>

            <label>Notas (opcional)
                <textarea id="notes" rows="2"></textarea>
            </label>

            <p id="form-error" class="error" role="alert" hidden></p>
            <button type="submit">Enviar pedido</button>
            </form>
        </section>

        <section class="card" aria-labelledby="orders-title">
            <h2 id="orders-title">Pedidos</h2>
            <div id="orders" class="orders"></div>
        </section>
        </main>

    <section class="activity" aria-label="Observadores">
        <article class="card">
            <h3>Cocina</h3>
            <small>Observer 1: solo pedidos nuevos</small>
            <ul id="kitchen"></ul>
        </article>
        <article class="card">
            <h3>Avisos al cliente</h3>
            <small>Observer 2: cambios de estado</small>
            <ul id="customer-msgs"></ul>
        </article>
        <article class="card">
            <h3>Bitácora</h3>
            <small>Observer 3: todo lo que ocurre</small>
            <ul id="log"></ul>
        </article>
    </section>

        <script src="/app.js" type="module"></script>
    </body>
</html>
